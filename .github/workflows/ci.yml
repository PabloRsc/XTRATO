name: XTRATO CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  tests:
    name: Python tests and container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run test suite
        run: python -m pytest -q

      - name: Smoke-test Alembic migrations on SQLite
        run: alembic upgrade head

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        run: node --check static/app.js

      - name: Build Docker image
        run: docker build -t xtrato:ci .

      - name: Smoke-test app with PostgreSQL using Docker Compose
        env:
          APP_ENV: development
          APP_SECRET_KEY: ci-test-secret-key-for-github-actions-only
          COOKIE_SECURE: "false"
          APP_TIMEZONE: America/Sao_Paulo
          POSTGRES_DB: xtrato_ci
          POSTGRES_USER: xtrato
          POSTGRES_PASSWORD: ci-test-postgres-password
          INITIAL_ADMIN_USERNAME: ci-admin
          INITIAL_ADMIN_PASSWORD: ci-test-initial-password
          APP_PORT: "8000"
          DOMAIN: localhost
        run: |
          set -euo pipefail
          docker compose up -d --build
          trap 'docker compose down -v' EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker compose logs --no-color app db
            exit 1
          fi

          login_response="$(curl --fail --silent --show-error \
            -c cookies.txt \
            -H 'Content-Type: application/json' \
            -H 'X-Xtrato-Request: 1' \
            -d '{"username":"ci-admin","password":"ci-test-initial-password"}' \
            http://127.0.0.1:8000/api/auth/login)"
          echo "$login_response" | grep -q '"username":"ci-admin"'

          backup_response="$(curl --fail --silent --show-error \
            -b cookies.txt \
            http://127.0.0.1:8000/api/backup)"
          echo "$backup_response" | grep -q '"format":"xtrato-backup"'

          echo "$backup_response" > backup.json
          jq '. + {confirmation: "RESTAURAR"}' backup.json > restore.json
          restore_response="$(curl --fail --silent --show-error \
            -b cookies.txt \
            -H 'Content-Type: application/json' \
            -H 'X-Xtrato-Request: 1' \
            --data-binary @restore.json \
            http://127.0.0.1:8000/api/backup/restore)"
          echo "$restore_response" | grep -q '"ok":true'

          card_response="$(curl --fail --silent --show-error \
            -b cookies.txt \
            -H 'Content-Type: application/json' \
            -H 'X-Xtrato-Request: 1' \
            -d '{"name":"CI Card","closing_day":25,"due_day":5,"due_month_offset":1,"color":"#247a57"}' \
            http://127.0.0.1:8000/api/cards)"
          card_id="$(echo "$card_response" | jq -r '.id')"

          curl --fail --silent --show-error -b cookies.txt -X DELETE \
            -H 'X-Xtrato-Request: 1' \
            "http://127.0.0.1:8000/api/cards/$card_id" >/dev/null

          curl --fail --silent --show-error -b cookies.txt \
            "http://127.0.0.1:8000/api/cards?include_archived=true" \
            | jq -e --argjson id "$card_id" 'any(.[]; .id == $id and .active == false)' >/dev/null

          curl --fail --silent --show-error -b cookies.txt -X POST \
            -H 'X-Xtrato-Request: 1' \
            "http://127.0.0.1:8000/api/cards/$card_id/reactivate" >/dev/null

          curl --fail --silent --show-error -b cookies.txt \
            http://127.0.0.1:8000/api/cards \
            | jq -e --argjson id "$card_id" 'any(.[]; .id == $id and .active == true)' >/dev/null

          cp cookies.txt stale-cookies.txt
          password_response="$(curl --fail --silent --show-error \
            -b cookies.txt -c cookies.txt \
            -H 'Content-Type: application/json' \
            -H 'X-Xtrato-Request: 1' \
            -d '{"current_password":"ci-test-initial-password","new_password":"ci-test-new-strong-password"}' \
            http://127.0.0.1:8000/api/auth/password)"
          echo "$password_response" | grep -q '"reauthenticate":true'

          stale_session_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -b stale-cookies.txt http://127.0.0.1:8000/api/auth/me)"
          test "$stale_session_status" = "401"

          old_password_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -c failed-login-cookies.txt \
            -H 'Content-Type: application/json' \
            -H 'X-Xtrato-Request: 1' \
            -d '{"username":"ci-admin","password":"ci-test-initial-password"}' \
            http://127.0.0.1:8000/api/auth/login)"
          test "$old_password_status" = "401"

          new_login_response="$(curl --fail --silent --show-error \
            -b cookies.txt -c cookies.txt \
            -H 'Content-Type: application/json' \
            -H 'X-Xtrato-Request: 1' \
            -d '{"username":"ci-admin","password":"ci-test-new-strong-password"}' \
            http://127.0.0.1:8000/api/auth/login)"
          echo "$new_login_response" | grep -q '"username":"ci-admin"'
